requires-python = ">=3.14,<3.15"
dependencies = [
  "bedrock-agentcore==1.23.0",
  "strands-agents==1.55.1",
  "boto3==1.43.93",
]

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
